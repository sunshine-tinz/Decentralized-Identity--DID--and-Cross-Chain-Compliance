name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Soroban Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: cargo-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: WASM build
        run: cargo build --target wasm32-unknown-unknown --release --locked
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Rust dependency audit (verify wasm32 excludes host-only advisories)
        run: |
          if cargo tree --locked --target wasm32-unknown-unknown -i crypto-bigint 2>/dev/null | grep -q 'crypto-bigint'; then
            echo "crypto-bigint unexpectedly linked into wasm32 contract target!"
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2024-0436
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm-artifacts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm

  evm-contracts:
    name: EVM Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry EVM bytecode tests
        run: forge test -vv

  kyc-issuer:
    name: KYC Issuer Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kyc-issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/kyc-issuer/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (zero vulnerabilities gate)
        run: npm audit

  cross-chain-bridge:
    name: Cross-Chain Bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cross-chain-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/cross-chain-bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (zero vulnerabilities gate)
        run: npm audit

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Dependency audit (zero vulnerabilities gate)
        run: npm audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Dependency audit (zero vulnerabilities gate)
        run: npm audit

  security-scan:
    name: Secret & Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no secret or env files tracked
        run: |
          if git ls-files | grep -E '\.(env|pem|key)$'; then
            echo "Forbidden secret/env file tracked in git!"
            exit 1
          fi
      - name: Scan for committed private keys
        run: |
          if git grep -n -E 'S[A-Z2-7]{55}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!*test*' ':!*__tests__*'; then
            echo "Potential private key material found in tracked source!"
            exit 1
          fi
