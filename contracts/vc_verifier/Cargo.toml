[package]
name = "vc-verifier"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` is required so the compliance engine can depend on this crate in tests
# (cross-contract policy evaluation). `cdylib` produces the deployable WASM.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
