[workspace]
resolver = "2"
members = [
    "did_registry",
    "vc_verifier",
    "compliance_engine",
]

[workspace.dependencies]
# NOTE: do not enable `testutils` here. It is a host-side, std-dependent feature and
# enabling it for all targets breaks the wasm32 contract build (see AUDIT.md C-1).
# Each crate enables it only for `[dev-dependencies]`.
soroban-sdk = { version = "21.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
